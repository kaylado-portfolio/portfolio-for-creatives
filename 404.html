<!doctype html>
<html lang="en">
  <head>
    <title>error page</title>
    <meta
      name="description"
      content="When writing a meta description, keep it between 140 and 160 characters so Google can display your entire message. Don’t forget to include your keyword!"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="images/svg+xml" href="assets/branding-images/cucumber.png" />
    <link rel="icon" type="image/png" href="assets/branding-images/favicon.png" />
    <meta property="og:image" content="screenshot.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
    <script src="https://kit.fontawesome.com/b2f983b3d8.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body class="error-page">
    <section class="hero">
      <div class="error-headline-wrapper">
        <ul class="list-section">
          <li><h1>Oh no! You lost your way...</h1></li>
          <li>
            <img
              src="assets/branding-images/error-video.gif"
              width="500"
              height="500"
              loading="lazy"
              alt="Describe your project"
            />
          </li>
          <li><a href="index.html" class="nav-link-primary error-button">TAKE ME BACK!</a></li>
        </ul>
      </div>
    </section>
  </body>
  <div class="flier">
    <img src="assets/branding-images/cucumber.png" alt="Describe your image" />
  </div>
  <script>
    myID = document.getElementById("myID");

    var myScrollFunc = function () {
      var y = window.scrollY;
      if (y >= 800) {
        myID.className = "bottomMenu show";
      } else {
        myID.className = "bottomMenu hide";
      }
    };

    window.addEventListener("scroll", myScrollFunc);
    document.addEventListener("DOMContentLoaded", () => {
      const observerOptions = {
        root: null, // Watches the main viewport/screen
        rootMargin: "0px 0px -50px 0px", // Triggers 50px before entering the screen so it feels smoother
        threshold: 0.1, // Triggers when 10% of the element is visible
      };

      const observerCallback = (entries, observer) => {
        entries.forEach((entry) => {
          // Check if the item has scrolled into view
          if (entry.isIntersecting) {
            // 1. Add the class to trigger your CSS animation
            entry.target.classList.add("is-visible");

            // 2. CRITICAL: Stop watching this item.
            // This ensures the animation only ever plays ONCE.
            observer.unobserve(entry.target);
          }
        });
      };

      const scrollObserver = new IntersectionObserver(observerCallback, observerOptions);

      // Grab all your grid items and apply the observer
      const gridItems = document.querySelectorAll(".work-page-grid-item");
      gridItems.forEach((item) => {
        scrollObserver.observe(item);
      });
    });
    document.addEventListener("DOMContentLoaded", () => {
      const cursor = document.querySelector(".custom-cursor");
      const links = document.querySelectorAll("a, button"); // Update selectors as needed

      if (!cursor) {
        console.error("Custom cursor element not found!");
        return;
      }

      window.addEventListener("mousemove", (e) => {
        cursor.style.left = `${e.clientX}px`;
        cursor.style.top = `${e.clientY}px`;
      });

      links.forEach((link) => {
        link.addEventListener("mouseenter", () => cursor.classList.add("expand"));
        link.addEventListener("mouseleave", () => cursor.classList.remove("expand"));
      });
    });
    const footer = document.querySelector("footer");

    const starSymbols = ["✦", "✧", "✴"];

    let lastX = null;
    let lastY = null;

    footer.addEventListener("pointermove", (e) => {
      // Only activate for mouse or pen
      if (e.pointerType === "touch") return;

      // Calculate cursor movement distance
      if (lastX !== null && lastY !== null) {
        const distance = Math.hypot(e.clientX - lastX, e.clientY - lastY);

        // Only create a star after moving 35px
        if (distance < 25) return;
      }

      lastX = e.clientX;
      lastY = e.clientY;

      // Create star element
      const star = document.createElement("span");
      star.classList.add("cursor-star");

      // Random star symbol
      star.textContent = starSymbols[Math.floor(Math.random() * starSymbols.length)];

      // Randomize star appearance
      const size = Math.random() * 25 + 20;
      const duration = Math.random() * 1.2 + 1.2;
      const drift = (Math.random() - 0.5) * 50;
      const rotation = Math.random() * 180;

      // Position at cursor
      star.style.left = `${e.clientX}px`;
      star.style.top = `${e.clientY}px`;

      // Apply randomized properties
      star.style.setProperty("--size", `${size}px`);
      star.style.setProperty("--duration", `${duration}s`);
      star.style.setProperty("--drift", `${drift}px`);
      star.style.setProperty("--rotation", `${rotation}deg`);

      // Add star to page
      document.body.appendChild(star);

      // Remove star after animation
      star.addEventListener("animationend", () => {
        star.remove();
      });
    });
  </script>
  <div class="custom-cursor">
    <span class="cursor-arrow"></span>
  </div>
</html>
